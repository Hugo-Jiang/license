name: Build Binaries

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
                  cache: true

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64

            - name: Build binaries
              run: |
                  mkdir -p build
                  # Linux amd64
                  CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/license-linux-amd64 ./main.go
                  # Linux arm64
                  CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -ldflags="-s -w" -o build/license-linux-arm64 ./main.go
                  # Windows amd64
                  CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc go build -ldflags="-s -w" -o build/license-windows-amd64.exe ./main.go

            - name: Create Release
              uses: softprops/action-gh-release@v1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: |
                      build/license-linux-amd64
                      build/license-linux-arm64
                      build/license-windows-amd64.exe
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/upload-artifact@v4
              with:
                  name: binaries
                  path: build/
