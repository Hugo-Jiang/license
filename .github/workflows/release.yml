name: Build Binaries

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.21"
                  cache: true

            - name: Build binaries
              run: |
                  mkdir -p build
                  # Linux amd64
                  GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/license-linux-amd64 ./main.go
                  # Linux arm64
                  GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/license-linux-arm64 ./main.go
                  # FreeBSD amd64
                  GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o build/license-freebsd-amd64 ./main.go
                  # Windows amd64
                  GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/license-windows-amd64.exe ./main.go
                  # macOS arm64
                  GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/license-macos-arm64 ./main.go

            - name: Create Release
              uses: softprops/action-gh-release@v1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: |
                      build/license-linux-amd64
                      build/license-linux-arm64
                      build/license-freebsd-amd64
                      build/license-windows-amd64.exe
                      build/license-macos-arm64
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/upload-artifact@v4
              with:
                  name: binaries
                  path: build/
